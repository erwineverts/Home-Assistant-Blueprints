blueprint:
  name: Switch controls main or secondary light by time
  description: >
    A switch toggles your lights. When the switch is turned on, the main light
    comes on during the day, and the secondary light (e.g. a night light) comes
    on instead during the configured time window. Turning the switch off turns
    both lights off. If the time window starts or ends while the switch is
    already on, the lights crossfade to the new configuration (the fade is
    applied by lights that support transitions; others simply switch).
  domain: automation	
  author: Erwin Everts
  homeassistant:
    min_version: 2024.10.0
  input:
    control_switch:
      name: Switch
      description: The switch that controls the lights.
      selector:
        entity:
          domain: switch
    main_light:
      name: Main light
      description: Used when the switch is on outside the secondary time window.
      selector:
        entity:
          domain: light
    secondary_light:
      name: Secondary light
      description: Used when the switch is on inside the secondary time window.
      selector:
        entity:
          domain: light
    secondary_start:
      name: Secondary light starts at
      description: From this time onwards the secondary light is used.
      default: "22:00:00"
      selector:
        time:
    secondary_end:
      name: Secondary light ends at
      description: From this time onwards the main light is used again.
      default: "06:00:00"
      selector:
        time:
    transition:
      name: Fade duration (seconds)
      description: >
        Crossfade duration when the time window changes while the switch is on.
        Set to 0 to disable. Lights that don't support transitions ignore it.
      default: 10
      selector:
        number:
          min: 0
          max: 300
          step: 1
          unit_of_measurement: s
          mode: slider

mode: restart

variables:
  fade_seconds: !input transition

trigger:
  - platform: state
    entity_id: !input control_switch
    to: "on"
    id: switch_on
  - platform: state
    entity_id: !input control_switch
    to: "off"
    id: switch_off
  - platform: time
    at: !input secondary_start
    id: time_change
  - platform: time
    at: !input secondary_end
    id: time_change

action:
  - choose:
      # Switch on, or the time window changed while the switch is on
      - conditions:
          - condition: trigger
            id:
              - switch_on
              - time_change
          - condition: state
            entity_id: !input control_switch
            state: "on"
        sequence:
          - variables:
              # No fade when the switch itself was just turned on
              fade: "{{ 0 if trigger.id == 'switch_on' else fade_seconds }}"
          - choose:
              # Inside the secondary time window -> secondary light
              - conditions:
                  - condition: time
                    after: !input secondary_start
                    before: !input secondary_end
                sequence:
                  - service: light.turn_on
                    target:
                      entity_id: !input secondary_light
                    data:
                      transition: "{{ fade }}"
                  - service: light.turn_off
                    target:
                      entity_id: !input main_light
                    data:
                      transition: "{{ fade }}"
            # Otherwise -> main light
            default:
              - service: light.turn_on
                target:
                  entity_id: !input main_light
                data:
                  transition: "{{ fade }}"
              - service: light.turn_off
                target:
                  entity_id: !input secondary_light
                data:
                  transition: "{{ fade }}"
      # Switch turned off -> everything off
      - conditions:
          - condition: trigger
            id: switch_off
        sequence:
          - service: light.turn_off
            target:
              entity_id:
                - !input main_light
                - !input secondary_light
