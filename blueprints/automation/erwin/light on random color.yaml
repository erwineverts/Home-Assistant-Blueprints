blueprint:
  name: Random color when light becomes available
  description: >
    When the selected light changes from "unavailable" to available (for example
    after the power is restored or a smart bulb reconnects), it slowly
    transitions to a randomly chosen color at the brightness you set.
  domain: automation
  author: Erwin Everts
  homeassistant:
    min_version: 2024.10.0
  input:
    light_entity:
      name: Light
      description: The light that should change color when it becomes available.
      selector:
        entity:
          filter:
            - domain: light
    brightness:
      name: Brightness
      description: Brightness to transition to (in percent).
      default: 50
      selector:
        number:
          min: 1
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: slider
    transition:
      name: Transition time
      description: How long the fade to the new color and brightness takes (in seconds).
      default: 30
      selector:
        number:
          min: 1
          max: 600
          step: 1
          unit_of_measurement: s
          mode: box
    min_saturation:
      name: Minimum saturation
      description: >
        Lowest saturation for the random color. Raise it to avoid washed-out,
        pastel-looking colors.
      default: 60
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: slider
    startup_delay:
      name: Startup delay
      description: >
        Seconds to wait after the light becomes available before sending the
        command. Helps with bulbs (e.g. Zigbee/Wi-Fi) that need a moment to be
        ready.
      default: 3
      selector:
        number:
          min: 0
          max: 60
          step: 1
          unit_of_measurement: s
          mode: box

mode: restart
max_exceeded: silent

variables:
  light_entity: !input light_entity
  brightness: !input brightness
  transition: !input transition
  min_saturation: !input min_saturation

triggers:
  - trigger: state
    entity_id: !input light_entity
    from: "unavailable"

conditions:
  - condition: not
    conditions:
      - condition: state
        entity_id: !input light_entity
        state:
          - "unavailable"
          - "unknown"

actions:
  - delay:
      seconds: !input startup_delay
  - action: light.turn_on
    target:
      entity_id: !input light_entity
    data:
      hs_color:
        - "{{ range(0, 360) | random }}"
        - "{{ range(min_saturation | int, 101) | random }}"
      brightness_pct: !input brightness
      transition: !input transition
