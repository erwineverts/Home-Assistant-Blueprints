blueprint:
  name: Simple wake-up light
  description: >
    Slowly fades a light up to full brightness on selected weekdays at a start
    time, and turns it off again at an end time. Optionally skipped when a
    vacation/holiday toggle is on.
  domain: automation
  author: Erwin Everts
  input:
    light_target:
      name: Wake-up light
      description: The light to use as wake-up light.
      selector:
        entity:
          domain: light
    start_time:
      name: Start time
      description: When the light starts fading up.
      default: '06:20:00'
      selector:
        time:
    end_time:
      name: Off time
      description: When the light is turned off again.
      default: '07:15:00'
      selector:
        time:
    weekdays:
      name: Weekdays
      description: Days on which the light starts fading up.
      default:
        - mon
        - tue
        - wed
        - thu
        - fri
      selector:
        select:
          multiple: true
          mode: list
          options:
            - label: Monday
              value: mon
            - label: Tuesday
              value: tue
            - label: Wednesday
              value: wed
            - label: Thursday
              value: thu
            - label: Friday
              value: fri
            - label: Saturday
              value: sat
            - label: Sunday
              value: sun
    vacation_switch:
      name: Vacation switch (optional)
      description: >
        If this boolean is on, the automation does not run. Leave empty to
        always run.
      default: []
      selector:
        entity:
          domain: input_boolean
    start_brightness:
      name: Start brightness (%)
      default: 2
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: '%'
    start_color_temp:
      name: Start color temperature (K)
      default: 500
      selector:
        number:
          min: 500
          max: 10000
          unit_of_measurement: K
    end_brightness:
      name: End brightness (%)
      default: 100
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: '%'
    end_color_temp:
      name: End color temperature (K)
      default: 362
      selector:
        number:
          min: 500
          max: 10000
          unit_of_measurement: K
    transition_seconds:
      name: Fade duration (seconds)
      description: How long the fade from start to end brightness takes.
      default: 3000
      selector:
        number:
          min: 1
          max: 6000
          unit_of_measurement: s

mode: single

variables:
  light_target: !input light_target
  vacation_switch: !input vacation_switch
  start_brightness: !input start_brightness
  start_color_temp: !input start_color_temp
  end_brightness: !input end_brightness
  end_color_temp: !input end_color_temp
  transition_seconds: !input transition_seconds

triggers:
  - trigger: time
    id: 'On'
    at: !input start_time
  - trigger: time
    id: 'Off'
    at: !input end_time

conditions:
  - condition: or
    conditions:
      - condition: template
        value_template: "{{ vacation_switch in [none, '', []] }}"
      - condition: template
        value_template: "{{ is_state(vacation_switch, 'off') }}"
  - condition: or
    conditions:
      - condition: trigger
        id: 'Off'
      - condition: time
        weekday: !input weekdays

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: 'On'
        sequence:
          - action: light.turn_on
            target:
              entity_id: !input light_target
            data:
              color_temp_kelvin: "{{ start_color_temp | int }}"
              brightness_pct: "{{ start_brightness | int }}"
            continue_on_error: true
          - delay:
              seconds: 2
          - action: light.turn_on
            target:
              entity_id: !input light_target
            data:
              transition: "{{ transition_seconds | int }}"
              color_temp_kelvin: "{{ end_color_temp | int }}"
              brightness_pct: "{{ end_brightness | int }}"
      - conditions:
          - condition: trigger
            id: 'Off'
        sequence:
          - action: light.turn_off
            target:
              entity_id: !input light_target
